name: Build installers
on: { workflow_dispatch: {}, push: { tags: ['v*'] } }

# Needed so a tag build can publish the installer as a GitHub Release (what the Windows auto-update reads).
permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/ci-prepare-release.cjs
      - run: npm install
      # Tag push (v1.0.3): build AND publish a Release. Manual run: build only, nothing is published.
      - run: npm run electron:build -- --publish ${{ github.ref_type == 'tag' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STORE_ID: ${{ secrets.VITE_STORE_ID }}
      - uses: actions/upload-artifact@v4
        with: { name: BarPOS-windows-installer, path: release/*.exe }

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --ignore-scripts
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STORE_ID: ${{ secrets.VITE_STORE_ID }}
      - run: npx cap add android && npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: { name: BarPOS-android-apk, path: android/app/build/outputs/apk/debug/*.apk }
